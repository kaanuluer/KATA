name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reference-tests:
    name: reference pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the reference library
        working-directory: reference/python
        run: python -m pip install -e ".[dev]"
      - name: Run the reference suite
        working-directory: reference/python
        run: python -m pytest -q

  service-tests:
    name: service pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the service and the reference library
        run: python -m pip install "./reference/python" "./service[dev]"
      - name: Run the service suite
        working-directory: service
        run: python -m pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Check syntax and undefined names
        run: ruff check

  dependencies:
    name: dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit the reference library
        run: pip-audit --progress-spinner off --path reference/python
      - name: Audit the service
        run: pip-audit --progress-spinner off --path service

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan the repository history
        run: /tmp/gitleaks detect --source . --redact --exit-code 1

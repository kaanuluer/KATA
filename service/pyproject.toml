[project]
name = "kata-service"
version = "0.1.0"
description = "Global Agent Bureau service. KATA is the framework. Source-available, noncommercial."
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{name = "Kaan Uluer"}]
dependencies = [
  "cryptography>=43",
  "fastapi>=0.117.1",
  "markdown>=3.7",
  "psycopg[binary]>=3.2",
  "webauthn>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
aws = ["boto3>=1.35"]

[tool.setuptools.packages.find]
include = ["kata_service*"]

[tool.setuptools.package-data]
kata_service = ["static/*", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../reference/python/src"]
markers = [
  "long: opt-in measurement; set KATA_RUN_LONG=1",
]

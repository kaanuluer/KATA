[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kata-intent"
version = "0.1.0"
description = "Reference implementation of KATA intent agreements. Concept / open design, not production ready."
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{name = "Kaan Uluer"}]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.22"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
